name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 08:00 UTC (05:00 AM hora de Chile)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

jobs:
  keep-alive:
    name: Ping Supabase PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase PostgREST
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://msbsfffxazpmxdcbvapf.supabase.co/rest/v1/master_costs?select=id&limit=1" \
            -H "apikey: sb_publishable_aOF9xhZpulNeXr55eL3gJA_5yJ3cVxV" \
            -H "Authorization: Bearer sb_publishable_aOF9xhZpulNeXr55eL3gJA_5yJ3cVxV")
          
          echo "Supabase HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Conexión a Supabase exitosa. Contador de inactividad reseteado."
          else
            echo "Alerta: Respuesta inusual con código $HTTP_STATUS"
            exit 1
          fi
